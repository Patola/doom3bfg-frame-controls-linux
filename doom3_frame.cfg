// Steam Frame controls for Fully Possessed. Loaded after vr_openvr.cfg.
// Trackpad directions carry the physical D-pad for menu navigation.
unbind "STEAMVR_LEFT_PAD_UP"
unbind "STEAMVR_LEFT_PAD_DOWN"
unbind "STEAMVR_LEFT_PAD_LEFT"
unbind "STEAMVR_LEFT_PAD_RIGHT"
set vr_openVrStuckPadAxisFix "0"
// Preserve left-stick events that the Inventory carousel uses.
set vr_joystickMenuMapping "0"

bind "STEAMVR_LEFT_JS_UP" "_forward"
bind "STEAMVR_LEFT_JS_DOWN" "_back"
bind "STEAMVR_LEFT_JS_LEFT" "_moveleft"
bind "STEAMVR_LEFT_JS_RIGHT" "_moveright"
bind "STEAMVR_RIGHT_JS_LEFT" "_left"
bind "STEAMVR_RIGHT_JS_RIGHT" "_right"
bind "STEAMVR_RIGHT_JS_UP" "_impulse14"
bind "STEAMVR_RIGHT_JS_DOWN" "_impulse15"

// Keep motion controls active when the shim submits the gamepad Equip input.
set vr_autoSwitchControllers "0"

bind "JOY32" "_impulse16" // left bumper: flashlight / previous PDA tab
bind "JOY41" "_speed"     // left stick click: sprint
bind "JOY56" "_use"       // right A: use
bind "JOY57" "_impulse14" // right bumper: next weapon / next PDA tab
bind "JOY59" "_impulse40" // right B: pause menu
bind "JOY3" "_impulse13"  // right X via XInput: equip in Inventory, reload in game
bind "JOY60" "_impulse13" // right X fallback when the shim is disabled
bind "JOY61" "_impulse19" // right Y: PDA
bind "JOY62" "_teleport"  // right stick click: teleport
